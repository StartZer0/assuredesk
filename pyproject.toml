[project]
name = "assuredesk"
version = "0.1.0"
description = "Permission-aware questionnaire review with bounded corrective retrieval"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "jinja2>=3.1,<4",
  "python-multipart>=0.0.20,<1",
  "sqlalchemy>=2.0,<3",
  "alembic>=1.15,<2",
  "psycopg[binary,pool]>=3.2,<4",
  "pgvector>=0.4,<1",
  "langgraph>=1.0,<2",
  "langgraph-checkpoint-postgres>=3,<4",
  "langchain-text-splitters>=1,<2",
  "fastembed>=0.7,<1",
  "rank-bm25>=0.2.2,<1",
  "openpyxl>=3.1,<4",
  "defusedxml>=0.7,<1",
  "pypdf>=6,<7",
  "argon2-cffi>=23,<26",
  "cryptography>=46,<49",
]

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "httpx>=0.28,<1",
    "ruff>=0.11,<1",
    "mypy>=1.15,<2",
    "playwright>=1.50,<2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
