name: AssureDesk verification
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.2-pg17
        env:
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: assuredesk
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://postgres:test-only@localhost:5432/assuredesk
      TEST_DATABASE_URL: postgresql+psycopg://postgres:test-only@localhost:5432/assuredesk
      TEST_PARSER_SANDBOX: '1'
      UV_PYTHON: '3.12'
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.11.19'
      - run: sudo apt-get update && sudo apt-get install -y libseccomp2
      - name: PostgreSQL 17 recovery tools
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          curl --fail --silent --show-error https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo tee /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc >/dev/null
          . /etc/os-release
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt ${VERSION_CODENAME}-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update && sudo apt-get install -y postgresql-client-17
          echo '/usr/lib/postgresql/17/bin' >> "$GITHUB_PATH"
      - run: uv sync --frozen
      - run: uv run ruff check . && uv run ruff format --check .
      - run: uv run mypy app/schema.py app/config.py --follow-imports=silent --ignore-missing-imports
      - run: uv run alembic upgrade head && uv run python -m app.cli checkpoints
      - run: uv run playwright install --with-deps chromium
      - run: TEST_BROWSER=1 uv run pytest -q --junitxml=output/tests.xml
      - run: uv run python -m app.cli inventory > output/dependency-licenses.json
      - name: Secret scan (tracked files only)
        run: |
          if git grep -lE '(gsk_[A-Za-z0-9]{35,}|sk-[A-Za-z0-9]{32,}|apikey_[a-f0-9]{25,}|BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY)' -- . ':!.github/workflows/verify.yml'; then
            echo 'Potential secret detected'; exit 1
          fi
      - run: docker build -t assuredesk:ci .
      - name: Nonroot and parser confinement inside image
        run: |
          docker run --rm assuredesk:ci python -c 'import os; assert os.getuid() != 0'
          docker run --rm --security-opt no-new-privileges:true --cap-drop ALL assuredesk:ci python -m app.cli check-parser
      - name: API container startup without model credentials
        run: |
          docker run -d --name assuredesk-api --network host --cap-drop ALL --security-opt no-new-privileges:true -e DATABASE_URL -e LOCAL_HTTP=1 assuredesk:ci
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8000/health/ready; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:8000/health/ready
          docker exec assuredesk-api python -c 'import os; assert os.getuid() != 0 and not any(os.getenv(k) for k in ("MOONSHOT_API_KEY", "GROQ_API_KEY"))'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification
          path: output/
# No provider keys and no paid generation in pull-request jobs.
